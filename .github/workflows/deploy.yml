name: CI/CD Backend Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      # 2️⃣ Detect database folder changes
      - name: Check database changes
        id: db_changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep '^database/'; then
            echo "db_changed=true" >> $GITHUB_OUTPUT
          else
            echo "db_changed=false" >> $GITHUB_OUTPUT
          fi

      # 3️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 4️⃣ Deploy to EC2
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            cd /var/www/ecommerce-api

            echo "Fixing base permissions..."
            sudo chown -R ubuntu:www-data .

            echo "Pulling latest code..."
            git reset --hard
            git pull origin ${{ github.ref_name }}

            echo "Ensuring Laravel directories exist..."
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            echo "Fixing Laravel writable permissions..."
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "Installing dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "Clearing Laravel caches..."
            php artisan optimize:clear

            echo "Checking database changes..."
            if [ "${{ steps.db_changes.outputs.db_changed }}" = "true" ]; then
              echo "Database folder changed."
              if [ "${{ github.ref_name }}" = "main" ]; then
                echo "Production branch → migrate"
                php artisan migrate --force
              else
                echo "Develop branch → migrate:fresh --seed"
                php artisan migrate:fresh --seed
              fi
            else
              echo "No database changes detected"
            fi

            echo "Optimizing Laravel..."
            php artisan optimize

            echo "Restarting services..."
            sudo systemctl restart php8.2-fpm
            sudo systemctl restart nginx

            echo "Restarting queue workers..."
            sudo supervisorctl restart all

            echo "🚀 Deployment completed"

          EOF