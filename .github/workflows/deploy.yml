name: CI/CD Backend Deploy

on:
  push:
    branches: [develop, main]

# Prevent concurrent deployments to the same environment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.db_changes.outputs.db_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql
          coverage: none

      - name: Detect Database Changes
        id: db_changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^database/'; then
            echo "db_changed=true" >> $GITHUB_OUTPUT
          else
            echo "db_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      # Optional: Run tests before even thinking about deploying
      # - name: Run Tests
      #   run: php artisan test

      - name: Create Deployment Artifact
        run: tar -czf release.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Use environments for better secret management (Settings > Environments)
    environment: 
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Transfer Artifact to EC2
        run: |
          scp -o StrictHostKeyChecking=no release.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/release.tar.gz

      - name: Execute Remote Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e # Exit immediately if a command fails
            
            PROJECT_ROOT="/var/www/ecommerce-api"
            cd $PROJECT_ROOT

            echo "📦 Extracting release..."
            sudo tar -xzf /tmp/release.tar.gz -C $PROJECT_ROOT
            sudo chown -R ubuntu:www-data .

            echo "⚙️ Configuring Environment..."
            # Ensure storage permissions are correct every time
            sudo chmod -R 775 storage bootstrap/cache

            echo "📋 Managing Database..."
            if [ "${{ needs.build-and-test.outputs.db_changed }}" = "true" ]; then
              if [ "${{ github.ref_name }}" = "main" ]; then
                php artisan migrate --force
              else
                php artisan migrate:fresh --seed --force
              fi
            fi

            echo "🚀 Optimizing & Restarting..."
            php artisan optimize
            sudo systemctl restart php8.2-fpm
            
            # Restart Workers only if they exist
            sudo supervisorctl restart all || echo "Supervisor not found, skipping..."
            
            echo "✅ Deployment Successful"
          EOF

  # Bonus: Final Health Check
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Service Status
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://api.exclusive.quest/health || curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }})
          if [ "$status_code" -ne 200 ]; then
            echo "Site is down with status $status_code"
            exit 1
          fi