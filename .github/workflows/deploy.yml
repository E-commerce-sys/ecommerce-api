name: CI/CD Backend Deploy

on:
  push:
    branches:
      - develop  # change to your branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0  # <- fixed version
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Step 3: Deploy to EC2
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /var/www/ecommerce-api
            # Reset local changes and pull latest code
            git reset --hard
            git pull origin develop
            # Install PHP dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader
            # Run migrations with force (do NOT delete data)
            php artisan migrate --force
            # Optimize Laravel performance
            php artisan optimize
            # Set proper permissions for storage & cache
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            # Restart Nginx to apply changes
            sudo systemctl restart nginx
          EOF