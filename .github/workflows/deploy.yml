name: CI/CD Backend Deploy

on:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.db_changes.outputs.db_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, pdo_pgsql
          coverage: none

      - name: Detect Database Changes
        id: db_changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^database/'; then
            echo "db_changed=true" >> $GITHUB_OUTPUT
          else
            echo "db_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Create Deployment Artifact
        # Excludes prevents race conditions and keeps the file size small
        run: tar --exclude='./.git' --exclude='./release.tar.gz' -czf release.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Transfer Artifact to EC2
        run: |
          scp -o StrictHostKeyChecking=no release.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/release.tar.gz

      - name: Execute Remote Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e 
            
            PROJECT_ROOT="/var/www/ecommerce-api"
            cd $PROJECT_ROOT

            echo "📦 Extracting release..."
            sudo tar -xzf /tmp/release.tar.gz -C $PROJECT_ROOT
            sudo chown -R ubuntu:www-data .

            echo "⚙️ Configuring Environment..."
            sudo chmod -R 775 storage bootstrap/cache

            echo "📋 Managing Database..."
            if [ "${{ needs.build-and-test.outputs.db_changed }}" = "true" ]; then
              # Detect if we should use Docker or local PHP
              if sudo docker ps | grep -q "exclusive_api"; then
                CMD="sudo docker compose exec -T exclusive_api php artisan"
              else
                CMD="php artisan"
              fi

              if [ "${{ github.ref_name }}" = "main" ]; then
                $CMD migrate --force
              else
                $CMD migrate:fresh --seed --force
              fi
            fi

            echo "🚀 Optimizing & Restarting..."
            php artisan optimize
            
            # Restarting PHP 8.4 (matches your build environment)
            sudo systemctl restart php8.4-fpm || echo "Local PHP-FPM not found, checking Docker..."
            
            # Restart container if it exists
            if sudo docker ps | grep -q "exclusive_api"; then
              sudo docker compose restart exclusive_api
            fi
            
            sudo supervisorctl restart all || echo "Supervisor not found, skipping..."
            
            echo "✅ Deployment Successful"
          EOF

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Service Status
        run: |
          # Try the domain first, fallback to the IP if domain isn't fully configured
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://api.exclusive.quest/health || curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }})
          if [ "$status_code" -ne 200 ] && [ "$status_code" -ne 301 ] && [ "$status_code" -ne 302 ]; then
            echo "Site returned $status_code - health check failed."
            exit 1
          fi
          echo "Health check passed with status $status_code"